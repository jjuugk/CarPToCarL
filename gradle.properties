# AGP 8.7.3 + Gradle 8.10.2 需要 JDK 17+。系统默认 JAVA_HOME 指向 JDK 8 会导致编译
# 极慢甚至卡死，这里固定到项目自带的 JDK 17（与历次成功编译一致）。
# 约定：除非有新的明确需求，否则不要更换 JDK。
# org.gradle.java.home=<本机 JDK 路径，按需在本地覆盖；不要提交上来>
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
